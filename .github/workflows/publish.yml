name: Publish

# Trusted publishing (PyPI OIDC): no API token anywhere — PyPI issues a
# short-lived credential to this workflow only, for this repo, this file,
# and the "pypi" environment. Register the publisher at
# https://pypi.org/manage/project/gnosislab/settings/publishing/
# (owner: cloudcell, repo: gnosislab, workflow: publish.yml,
# environment: pypi) and create a "pypi" environment in the repo's
# GitHub settings — optionally with required reviewers so a tag push
# alone can't ship a release.
on:
  push:
    tags: ["v*"]

jobs:
  # Same gate as ci.yml — a tag can never publish a tree whose suite
  # fails on any supported Python.
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap strace

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --all-extras --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gnosislab
    permissions:
      id-token: write  # OIDC for trusted publishing + attestations

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          [ "$tag" = "$ver" ] || {
            echo "tag v$tag but pyproject.toml says $ver" >&2; exit 1; }

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
