name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Run ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - Episteme
        - Anamnesis
        - Zetesis
        - Arete
        - Agora
        - Execution / isolation
        - CLI / packaging
        - Documentation
        - Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GnosisLab version
      placeholder: "0.x.x or commit SHA"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Python:
        installation method:

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets or private information before posting.
